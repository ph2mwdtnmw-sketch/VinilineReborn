
name: Build VinilineReborn APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir source
          gh release download "$TAG" \
            --pattern "VinilineReborn.zip" \
            --dir source

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q source/VinilineReborn.zip -d extracted
          PROJECT=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" -type f
          gh release upload "$TAG" \
            "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk \
            --clobber

      - name: Save APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinilineReborn-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
