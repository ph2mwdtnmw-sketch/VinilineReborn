
name: Build VinilineReborn APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base project
        uses: actions/checkout@v4

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p source

          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "VinilineReborn.zip" \
            --dir source

          test -f source/VinilineReborn.zip

      - name: Extract and apply ZIP changes
        run: |
          mkdir -p extracted

          unzip -q source/VinilineReborn.zip -d extracted

          echo "Applying ZIP files to project..."

          rsync -a extracted/ ./

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew missing from repository"
            exit 1
          fi

          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle settings missing"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Android APK
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          mkdir -p final-apk

          find app/build/outputs/apk/debug \
            -type f -name "*.apk" \
            -exec cp {} final-apk/ \;

          if [ -z "$(ls -A final-apk)" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            final-apk/*.apk \
            --repo "$REPO" \
            --clobber

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinilineReborn-APK
          path: final-apk/*.apk
          retention-days: 30
