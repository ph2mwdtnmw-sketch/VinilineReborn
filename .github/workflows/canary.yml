
name: Build VinilineReborn APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: VinilineReborn.zip
          if-no-files-found: warn
          retention-days: 1

      - name: Stop if ZIP is missing
        run: |
          echo "This workflow needs a ZIP upload mechanism."
          exit 1
