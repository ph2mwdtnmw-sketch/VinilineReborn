
name: Build VinilineReborn APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p source

          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "VinilineReborn.zip" \
            --dir source

          test -f source/VinilineReborn.zip

      - name: Extract Android project
        run: |
          mkdir -p extracted

          unzip -q source/VinilineReborn.zip -d extracted

          PROJECT_FILE=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK files
        run: |
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found"
            exit 1
          fi

          find "$APK_DIR" -type f -name "*.apk"

          if ! find "$APK_DIR" -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK files were generated"
            exit 1
          fi

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" \
            -exec gh release upload "$TAG" {} \
              --repo "$REPO" \
              --clobber \;

      - name: Save APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinilineReborn-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
